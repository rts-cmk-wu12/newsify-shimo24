<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash Animation</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="splash1" class="splash">
        <img src="img/newsify_logo 2.png" alt="First Splash">
    </div>
    <div id="splash2" class="splash">
        <img src="img/newsify_logo 2.png" alt="Second Splash">
        <h1>Newsify</h1>
    </div>
    <div id="splash3" class="splash">
        <img src="img/Onboarding 2.png" alt="Third Splash">
        <h1>Welcome! Let's dive into your account!</h1>
        <a href="#">
         <button id="facebook-button">Continue with Facebook</button>
        </a>
        <p>Stay Connected, Everywhere, Anytime</p>
        <p>Welcome to Newsify, your ultimate destination for breaking news, exclusive stories, and tailored content.</p>
        <div class="bth-sc">
            <button id="skip-button">Skip</button>
            <button id="continue-button">Continue</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
